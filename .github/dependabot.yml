version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      cargo-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]
      egui:
        patterns: ["eframe", "egui*", "winit"]
        update-types: [major]
    commit-message:
      prefix: "deps"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci"

  - package-ecosystem: docker
    directory: /lab
    schedule:
      interval: weekly
    commit-message:
      prefix: "lab"

  # Base image of the ClusterFuzzLite build (.clusterfuzzlite/Dockerfile, pinned by digest).
  - package-ecosystem: docker
    directory: /.clusterfuzzlite
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"
