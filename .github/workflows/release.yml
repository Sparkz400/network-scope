name: release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: windows-latest
            label: windows-x64
          - os: ubuntu-latest
            label: linux-x86_64
          - os: macos-latest
            label: macos-arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check that the tag matches Cargo.toml
        id: version
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          cargo_version="$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)"
          if [ "$tag" != "$cargo_version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match Cargo.toml version $cargo_version"
            exit 1
          fi
          echo "version=$tag" >> "$GITHUB_OUTPUT"

      - name: Check the runner architecture
        if: runner.os == 'macOS'
        run: test "$(uname -m)" = arm64

      - name: Linux GUI build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev libgl1-mesa-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev

      - name: Rust toolchain (pinned in rust-toolchain.toml)
        run: rustup toolchain install

      # SOURCE_DATE_EPOCH from the commit time, source/cargo/rustup paths remapped, no incremental
      # build: the same commit gives the same binary wherever it is built. Linux x86_64 is the
      # target the `reproducible` workflow checks and docs/src/supply-chain.md explains.
      - name: Reproducible build environment
        shell: bash
        run: sh scripts/repro_env.sh "$GITHUB_WORKSPACE" >> "$GITHUB_ENV"

      - run: cargo build --release --locked

      - name: Package (Windows zip and installer)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $stage = "network-scope-$env:VERSION-${{ matrix.label }}"
          New-Item -ItemType Directory -Force -Path $stage, dist | Out-Null
          Copy-Item target\release\network-scope.exe, target\release\network-scope-cli.exe, README.md, LICENSE.txt, THIRD-PARTY-NOTICES.md, CHANGELOG.md -Destination $stage
          Compress-Archive -Path "$stage\*" -DestinationPath "dist\$stage.zip"
          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$env:VERSION" installer\network-scope.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with exit code $LASTEXITCODE" }
          Get-ChildItem dist

      - name: Package (tar.gz)
        if: runner.os != 'Windows'
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          stage="network-scope-${VERSION}-${{ matrix.label }}"
          mkdir -p "$stage" dist
          cp target/release/network-scope target/release/network-scope-cli README.md LICENSE.txt THIRD-PARTY-NOTICES.md CHANGELOG.md "$stage/"
          tar -czf "dist/$stage.tar.gz" "$stage"
          ls -l dist

      # Accuracy numbers of this release (roadmap A2): the benchmark scans the loopback lab of
      # lab/ground_truth.json with the release binary. Published as release files (so they are
      # covered by the checksums and the provenance); the gate itself is in ci.yml, not here.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: runner.os == 'Linux'
        with:
          python-version: "3.12"
      - name: Accuracy benchmark (Linux)
        if: runner.os == 'Linux'
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # The simulators use the real service ports; the runner's sshd holds port 22.
          sudo sysctl -w net.ipv4.ip_unprivileged_port_start=0
          sudo systemctl stop ssh.socket ssh.service || true
          python -I lab/benchmark.py --cli "$PWD/target/release/network-scope-cli" --out-dir benchmark-results
          cp benchmark-results/benchmark.json "dist/network-scope-${VERSION}-benchmark.json"
          cp benchmark-results/benchmark.md "dist/network-scope-${VERSION}-benchmark.md"
          ls -l dist

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ matrix.label }}
          path: dist/*
          if-no-files-found: error

  # CycloneDX SBOM of the dependency tree (all targets: Windows, Linux, macOS), as a release file.
  # It is a file in dist/ like the binaries, so it is in SHA256SUMS, covered by the provenance
  # attestations and attested as the SBOM of the release files in the `release` job.
  sbom:
    name: SBOM (CycloneDX)
    runs-on: ubuntu-latest
    env:
      CARGO_CYCLONEDX_VERSION: "0.5.10"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Rust toolchain (pinned in rust-toolchain.toml)
        run: rustup toolchain install

      - run: cargo install cargo-cyclonedx --version "$CARGO_CYCLONEDX_VERSION" --locked

      - name: Generate the SBOM
        run: |
          # The BOM timestamp follows SOURCE_DATE_EPOCH (honored by cargo-cyclonedx).
          export SOURCE_DATE_EPOCH="$(git log -1 --pretty=%ct)"
          version="${GITHUB_REF_NAME#v}"
          cargo cyclonedx --format json --spec-version 1.5 --target all             --override-filename "network-scope-${version}.cdx"
          mkdir -p dist
          cp "network-scope-${version}.cdx.json" dist/
          python3 -c "import json,sys; d=json.load(open(sys.argv[1])); assert d['bomFormat']=='CycloneDX' and d['components'], 'empty SBOM'; print(len(d['components']), 'components')" "dist/network-scope-${version}.cdx.json"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-sbom
          path: dist/*
          if-no-files-found: error

  release:
    name: publish release
    needs: [build, sbom]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write # signs the build provenance (Sigstore)
      attestations: write
    outputs:
      version: ${{ steps.checksums.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true

      - name: Checksums
        id: checksums
        working-directory: dist
        run: |
          sha256sum * > SHA256SUMS
          cat SHA256SUMS
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # Signed SLSA build provenance for every release file. Verify a download with:
      #   gh attestation verify network-scope-<version>-windows-x64.zip --repo Sparkz400/network-scope
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        id: provenance
        with:
          subject-path: dist/*

      # Signed SBOM attestation: the CycloneDX SBOM is the bill of materials of every packaged
      # release file. Verify with
      #   gh attestation verify <file> --repo Sparkz400/network-scope       #     --predicate-type https://cyclonedx.org/bom
      - uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        id: sbom-attestation
        with:
          subject-path: |
            dist/*.zip
            dist/*.tar.gz
            dist/*.exe
          sbom-path: dist/network-scope-${{ steps.checksums.outputs.version }}.cdx.json

      # The same signed provenance as a release file, for offline verification
      # (`gh attestation verify <file> --bundle <this file> --repo Sparkz400/network-scope`).
      # Attached under two names with identical content: .sigstore.json (the name the gh CLI
      # documentation uses) and .intoto.jsonl (the in-toto provenance name that tools such as
      # OpenSSF Scorecard look for). The bundle is a Sigstore bundle whose DSSE payload is an
      # in-toto statement with the SLSA provenance predicate.
      - name: Attach the provenance bundle
        env:
          BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
        run: |
          cp "$BUNDLE" "dist/network-scope-${GITHUB_REF_NAME#v}.sigstore.json"
          cp "$BUNDLE" "dist/network-scope-${GITHUB_REF_NAME#v}.intoto.jsonl"

      # The SBOM attestation bundle, for `gh attestation verify ... --bundle <this file>`.
      - name: Attach the SBOM attestation bundle
        env:
          BUNDLE: ${{ steps.sbom-attestation.outputs.bundle-path }}
        run: cp "$BUNDLE" "dist/network-scope-${GITHUB_REF_NAME#v}.sbom.sigstore.json"

      - name: Release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v ver="$version" '
            /^## \[/ { if (found) exit; if (index($0, "## [" ver "]") == 1) { found = 1; next } }
            found
          ' CHANGELOG.md > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "::error::No CHANGELOG.md section for $version"
            exit 1
          fi
          cat release-notes.md

      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          name: Network Scope ${{ github.ref_name }}
          body_path: release-notes.md
          # Appends the merged pull requests, grouped by .github/release.yml.
          generate_release_notes: true
          files: dist/*
          fail_on_unmatched_files: true

  # Container image of the CLI on GitHub Container Registry, pushed only after the release was
  # published (tag/Cargo.toml check and CHANGELOG section passed), so :latest never points at a
  # release that failed. linux/amd64 only.
  # Verify: gh attestation verify oci://ghcr.io/sparkz400/network-scope:<version> --owner Sparkz400
  container:
    name: container image
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push to ghcr.io
      id-token: write # signs the build provenance (Sigstore)
      attestations: write
    env:
      IMAGE: ghcr.io/sparkz400/network-scope # registry names must be lowercase
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: build
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
          # Artifact metadata storage records exist only for organization-owned repositories
          # (and would need `artifact-metadata: write`); this repository is user-owned.
          create-storage-record: false
