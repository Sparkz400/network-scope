name: secrets

# gitleaks over the full git history on every push and pull request, and weekly.
# The pinned release is downloaded from GitHub and verified against its published checksums.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "29 5 * * 1" # weekly, Monday 05:29 UTC
  workflow_dispatch:

permissions:
  contents: read

env:
  GITLEAKS_VERSION: "8.30.1"

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history, not just the last commit
          persist-credentials: false

      - name: Install gitleaks ${{ env.GITLEAKS_VERSION }}
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfLO "$base/$archive"
          curl -sSfLO "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          sha256sum --ignore-missing -c "gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          tar -xzf "$archive" gitleaks
          ./gitleaks version

      - name: Scan the git history
        run: ./gitleaks git . --redact --no-banner --exit-code 1
