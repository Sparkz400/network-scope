name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Linux GUI build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev libgl1-mesa-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev
      - name: Rust toolchain (pinned in rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo fmt --check
      - run: cargo clippy --release --all-targets --locked -- -D warnings
      - run: cargo test --release --locked
      - run: cargo build --release --locked
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      # The simulators listen on the real service ports (21, 22, 23, 502, ...). Linux reserves
      # ports below 1024 for root, and the runner's own sshd holds port 22.
      - name: Free the lab ports (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo sysctl -w net.ipv4.ip_unprivileged_port_start=0
          sudo systemctl stop ssh.socket ssh.service || true
      # macOS: binding 127.0.0.1 below port 1024 needs root, and Remote Login holds port 22.
      - name: Free the lab ports (macOS)
        if: runner.os == 'macOS'
        run: sudo launchctl bootout system/com.openssh.sshd || true
      - name: Lab end-to-end check (simulated weak and OT services on loopback)
        shell: bash
        run: |
          exe=target/release/network-scope
          [ "$RUNNER_OS" = "Windows" ] && exe=target/release/network-scope.exe
          if [ "$RUNNER_OS" = "macOS" ]; then
            sudo "$(command -v python)" lab/verify.py "$exe"
          else
            python lab/verify.py "$exe"
          fi
      # Ground-truth accuracy benchmark (roadmap A2): scans the loopback lab of lab/ground_truth.json
      # and fails when an accuracy metric is below lab/benchmark_baseline.json. Needs the ports freed
      # above, so it runs on Linux only. Timing is reported, not gated (runners are noisy).
      - name: Accuracy benchmark (Linux)
        if: runner.os == 'Linux'
        run: python -I lab/benchmark.py --cli "$PWD/target/release/network-scope-cli" --check --out-dir benchmark-results
      - name: Upload the benchmark result
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: benchmark-${{ runner.os }}
          path: benchmark-results/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: network-scope-${{ runner.os }}
          path: |
            target/release/network-scope
            target/release/network-scope.exe
            target/release/network-scope-cli
            target/release/network-scope-cli.exe
          if-no-files-found: error

  installer:
    name: windows installer
    needs: check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Rust toolchain (pinned in rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo build --release --locked
      - name: Build installer
        shell: pwsh
        run: |
          if (-not (Test-Path target\release\network-scope-cli.exe)) { throw "network-scope-cli.exe was not built" }
          choco install innosetup -y --no-progress
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$version" installer\network-scope.iss
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installer
          path: dist/*.exe
          if-no-files-found: error

  # Builds (does not push) the release container image when a pull request touches what it is
  # built from, so a broken Dockerfile shows up before a release tag. Not a required check.
  container:
    name: container image
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Changed files
        id: changes
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if git diff --name-only "$BASE" HEAD | grep -qE '^(Dockerfile|\.dockerignore|Cargo\.toml|Cargo\.lock|rust-toolchain\.toml|\.github/workflows/(ci|release)\.yml)$'; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "No container inputs changed; skipping the image build."
          fi
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        if: steps.changes.outputs.build == 'true'
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        if: steps.changes.outputs.build == 'true'
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: network-scope:ci
      - name: Smoke test (starts without GUI libraries, shared library check)
        if: steps.changes.outputs.build == 'true'
        shell: bash # -e and pipefail, so a failing `docker run | tee` fails the step
        run: |
          docker run --rm network-scope:ci --help
          docker run --rm --entrypoint ldd network-scope:ci /usr/local/bin/network-scope-cli | tee ldd.txt
          if grep -q 'not found' ldd.txt; then
            echo "::error::network-scope-cli has unresolved shared libraries in the image"
            exit 1
          fi
          docker image ls network-scope:ci
