name: Feature request
description: Suggest a new feature or an improvement.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        For open-ended ideas, consider starting a thread in [Discussions → Ideas](https://github.com/Sparkz400/network-scope/discussions/categories/ideas) first.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what is missing or hard today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How should it work? CLI options, GUI controls, output fields.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: traffic
    attributes:
      label: Does it send new network traffic?
      description: New transmitting features must be opt-in, rate-limited and respect Safe Mode (see CONTRIBUTING.md).
      options:
        - "No (analysis, UI, export, passive)"
        - "Yes"
        - "Not sure"
    validations:
      required: true
  - type: checkboxes
    id: contribute
    attributes:
      label: Contribution
      options:
        - label: I would like to work on this myself.
