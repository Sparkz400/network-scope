# Lab targets for Network Scope. Only start this on a network you own; the services are fake.
#   docker compose up -d --build
#   network-scope scan 172.28.0.0/24 --deep --ot --script ../scripts
# Services bind low ports inside the container (no root needed, the container sets
# net.ipv4.ip_unprivileged_port_start=0). The lab network is internal: no outside access.
services:
  weak-host:
    build: .
    networks:
      lab:
        ipv4_address: 172.28.0.10
    sysctls:
      - net.ipv4.ip_unprivileged_port_start=0
    cap_drop: [ALL]
    read_only: true
  redis-open:
    image: redis:7-alpine
    command: ["redis-server", "--protected-mode", "no"]
    networks:
      lab:
        ipv4_address: 172.28.0.11
    cap_drop: [ALL]
  # Real controller software for the test plant (ROADMAP L74). UNTESTED: no Docker on the development
  # machine, and the image name and tag below were written from memory: check them before use. It
  # is a profile of its own, so `docker compose up` does not start it:
  #   docker compose --profile plant-ci up -d openplc
  # OpenPLC serves Modbus/TCP on 502 and (with a program loaded) EtherNet/IP; log in at port 8080
  # to upload a program. The planted weaknesses of lab/plant_truth.json do not apply to it: it is
  # a second target for the same scan, not part of the ground truth.
  openplc:
    profiles: ["plant-ci"]
    image: ghcr.io/autonomy-logic/openplc-runtime:latest
    networks:
      lab:
        ipv4_address: 172.28.0.20
    cap_drop: [ALL]
networks:
  lab:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.28.0.0/24
