[package]
name = "network-scope-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
network-scope = { path = ".." }

# Not part of the main workspace: built only by `cargo fuzz` (nightly).
[workspace]
members = ["."]

[profile.release]
debug = 1

