# Reviewed OSV/RustSec advisories that do not affect Network Scope.
# Copy of ../osv-scanner.toml: osv-scanner applies a config only to its own directory, and
# fuzz/Cargo.lock lists the same transitive crates. Keep both files in sync.
# Read by osv-scanner and by the OpenSSF Scorecard "Vulnerabilities" check.
# Every entry expires: re-review it then, or drop it once the upstream crate has moved on.
# Real vulnerabilities are never listed here; they are fixed (see CHANGELOG, Security).
# cargo deny / cargo audit still report all of these in CI.

[[IgnoredVulns]]
id = "RUSTSEC-2024-0436"
ignoreUntil = 2027-05-19
reason = "paste is unmaintained (no vulnerability). It is only listed in Cargo.lock as a dependency of the optional metal GPU backend, which Network Scope never enables: `cargo tree -i paste --target all` finds no path, so it is not compiled."

