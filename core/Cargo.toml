[package]
name = "network-scope-core"
# Keep in step with the root package (a test in src/lib.rs checks it).
version = "0.6.0"
edition = "2024"
license = "MIT"
description = "Scanning, parsing, risk analysis and inventory engine behind Network Scope (no GUI)"
repository = "https://github.com/Sparkz400/network-scope"
homepage = "https://sparkz400.github.io/network-scope/"
keywords = ["network-scanner", "inventory", "ot-security", "modbus", "pcap"]
categories = ["network-programming"]

# The engine embeds `../data/*` and the tests use `../tests/fixtures`, so this crate builds from
# the repository checkout (path or git dependency); it is not published on its own.
publish = false
[lib]
path = "src/lib.rs"
doctest = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dns-lookup = "4"
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "sync", "io-util", "macros"] }
rusqlite = { version = "0.43", features = ["bundled"] }
libloading = "0.9"
pnet_packet = "0.35"
socket2 = { version = "0.6", features = ["all"] }
regex = "1"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
x509-parser = { version = "0.18", features = ["verify"] }
roxmltree = "0.21"
rhai = { version = "1", default-features = false, features = ["std", "sync", "no_module"] }
rustls-platform-verifier = "0.7"
# Already in the dependency tree through rustls; used for the SNMPv3 HMAC and digests.
ring = "0.17"

# Unix only: getrlimit/setrlimit to keep the in-flight socket pool under the open-file limit
# (core::socket_budget). Already in the dependency tree through socket2/ring.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
rcgen = { version = "0.14", default-features = false, features = ["ring"] }
# The benchmarks live in their own package (`bench/`): nothing here may turn on a feature of a
# shared dependency, or `cargo build` after `cargo test` compiles this crate a second time.
