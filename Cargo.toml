[package]
name = "network-scope"
version = "0.5.0"
edition = "2024"
# `cargo run` starts the GUI binary; the console twin is `--bin network-scope-cli`.
default-run = "network-scope"
license = "MIT"
description = "Network scanner and analysis tool: fast TCP/SYN/UDP scanning, service and TLS inspection, monitoring, reports and passive OT discovery"
repository = "https://github.com/Sparkz400/network-scope"
homepage = "https://sparkz400.github.io/network-scope/"
readme = "README.md"
keywords = ["network-scanner", "inventory", "ot-security", "modbus", "pcap"]
categories = ["command-line-utilities", "network-programming", "gui"]

# Console-subsystem twin of the GUI binary for scripts (shells wait, exit codes work).
# Its tests are the main binary's tests, so they are not run twice.
[[bin]]
name = "network-scope-cli"
path = "src/bin/network-scope-cli.rs"
test = false

[dependencies]
eframe = { version = "0.31.1", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
egui_extras = "0.31.1"
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.15"
dns-lookup = "2"
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "sync", "io-util", "macros"] }
rusqlite = { version = "0.41", features = ["bundled"] }
ratatui = "0.30"
crossterm = "0.29"
libloading = "0.8"
pnet_packet = "0.35"
socket2 = { version = "0.5", features = ["all"] }
regex = "1"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
x509-parser = "0.17"
roxmltree = "0.20"
rhai = { version = "1", default-features = false, features = ["std", "sync", "no_module"] }

[dev-dependencies]
rcgen = { version = "0.14", default-features = false, features = ["ring"] }

[target.'cfg(target_os = "macos")'.dependencies]
winit = "0.30"

[profile.release]
lto = true
codegen-units = 1
strip = true
