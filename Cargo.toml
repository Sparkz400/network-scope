[package]
name = "network-scope"
version = "0.4.0"
edition = "2021"
license = "MIT"
description = "Network scanner and analysis tool: fast TCP/SYN/UDP scanning, service and TLS inspection, monitoring, reports and passive OT discovery"

[dependencies]
eframe = { version = "0.31.1", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
egui_extras = "0.31.1"
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.15"
dns-lookup = "2"
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "sync", "io-util", "macros"] }
rusqlite = { version = "0.32", features = ["bundled"] }
ratatui = "0.29"
crossterm = "0.28"
libloading = "0.8"
pnet_packet = "0.35"
socket2 = { version = "0.5", features = ["all"] }
regex = "1"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
x509-parser = "0.17"
roxmltree = "0.20"
rhai = { version = "1", default-features = false, features = ["std", "sync", "no_module"] }

[dev-dependencies]
rcgen = { version = "0.13", default-features = false, features = ["ring"] }

[target.'cfg(target_os = "macos")'.dependencies]
winit = "0.30"

[profile.release]
lto = true
codegen-units = 1
strip = true
