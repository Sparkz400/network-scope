[package]
name = "network-scope"
version = "0.5.0"
edition = "2024"
# `cargo run` starts the GUI binary; the console twin is `--bin network-scope-cli`.
default-run = "network-scope"
license = "MIT"
description = "Network scanner and analysis tool: fast TCP/SYN/UDP scanning, service and TLS inspection, monitoring, reports and passive OT discovery"
repository = "https://github.com/Sparkz400/network-scope"
homepage = "https://sparkz400.github.io/network-scope/"
readme = "README.md"
keywords = ["network-scanner", "inventory", "ot-security", "modbus", "pcap"]
categories = ["command-line-utilities", "network-programming", "gui"]

# All code is in the library (src/lib.rs); both binaries call `network_scope::run`, and the
# fuzz targets in fuzz/ call `network_scope::fuzz`. The tests are the library's.
[lib]
path = "src/lib.rs"
doctest = false

# GUI binary: Windows GUI subsystem in release builds.
[[bin]]
name = "network-scope"
path = "src/main.rs"
test = false

# Console-subsystem twin of the GUI binary for scripts (shells wait, exit codes work).
[[bin]]
name = "network-scope-cli"
path = "src/bin/network-scope-cli.rs"
test = false

[dependencies]
eframe = { version = "0.37.0", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
egui_extras = "0.37.0"
# Since 0.32 the bundled symbol/emoji fonts (e.g. the "▶" on Start, the sort arrows) are opt-in.
egui = { version = "0.37.0", default-features = false, features = ["monochrome_emoji_fonts"] }
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.18"
dns-lookup = "4"
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "sync", "io-util", "macros"] }
rusqlite = { version = "0.43", features = ["bundled"] }
ratatui = "0.30"
crossterm = "0.29"
libloading = "0.9"
pnet_packet = "0.35"
socket2 = { version = "0.6", features = ["all"] }
regex = "1"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
x509-parser = "0.18"
roxmltree = "0.21"
rhai = { version = "1", default-features = false, features = ["std", "sync", "no_module"] }

[dev-dependencies]
rcgen = { version = "0.14", default-features = false, features = ["ring"] }

[target.'cfg(target_os = "macos")'.dependencies]
winit = "0.30"

[profile.release]
lto = true
codegen-units = 1
strip = true
