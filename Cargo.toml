[workspace]
members = [".", "core"]
# Plain `cargo build/test/clippy` cover both crates; `fuzz` has its own workspace (nightly only)
# and `.claude` holds scratch checkouts of agent worktrees.
default-members = [".", "core"]
exclude = ["fuzz", ".claude"]

[package]
name = "network-scope"
version = "0.5.1"
edition = "2024"
# `cargo run` starts the GUI binary; the console twin is `--bin network-scope-cli`.
default-run = "network-scope"
license = "MIT"
description = "Network scanner and analysis tool: fast TCP/SYN/UDP scanning, service and TLS inspection, monitoring, reports and passive OT discovery"
repository = "https://github.com/Sparkz400/network-scope"
homepage = "https://sparkz400.github.io/network-scope/"
readme = "README.md"
keywords = ["network-scanner", "inventory", "ot-security", "modbus", "pcap"]
categories = ["command-line-utilities", "network-programming", "gui"]

# The engine (scanning, parsers, risk analysis, store, ...) is the workspace member `core`
# (`network-scope-core`). This package is the GUI, CLI and TUI on top of it: the library
# (src/lib.rs) holds all of that code, both binaries call `network_scope::run`, and the fuzz
# targets in fuzz/ call `network_scope::fuzz` (re-exported from the core crate).
[lib]
path = "src/lib.rs"
doctest = true

# GUI binary: Windows GUI subsystem in release builds.
[[bin]]
name = "network-scope"
path = "src/main.rs"
test = false

# Console-subsystem twin of the GUI binary for scripts (shells wait, exit codes work).
[[bin]]
name = "network-scope-cli"
path = "src/bin/network-scope-cli.rs"
test = false

[dependencies]
network-scope-core = { path = "core" }
eframe = { version = "0.37.0", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
egui_extras = "0.37.0"
# Since 0.32 the bundled symbol/emoji fonts (e.g. the "▶" on Start, the sort arrows) are opt-in.
egui = { version = "0.37.0", default-features = false, features = ["monochrome_emoji_fonts"] }
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.18"
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "sync", "io-util", "macros"] }
ratatui = "0.30"
crossterm = "0.29"

[dev-dependencies]
network-scope-core = { path = "core", features = ["test-util"] }

[target.'cfg(target_os = "macos")'.dependencies]
winit = "0.30"

[profile.release]
lto = true
codegen-units = 1
strip = true
